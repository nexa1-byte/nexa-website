<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071525">
  <meta name="description" content="NEXA — Intelligent Business Automation. Website sedang disiapkan.">
  <title>NEXA — Website Deployment Preview</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px; color: #eff8ff;
      background: radial-gradient(circle at 73% 23%, #103b61 0%, transparent 37%),
                  radial-gradient(circle at 13% 80%, #082d50 0%, transparent 38%),
                  #061321;
    }
    main {
      position: relative; overflow: hidden; width: min(100%, 920px);
      padding: clamp(34px, 7vw, 80px); border: 1px solid rgba(136, 211, 255, .22);
      border-radius: 28px; background: linear-gradient(135deg, rgba(20, 52, 78, .78), rgba(5, 22, 39, .91));
      box-shadow: 0 30px 100px rgba(0, 0, 0, .27);
    }
    main::after {content:""; position:absolute; inset:0; pointer-events:none; opacity:.35;
      background:linear-gradient(100deg, transparent 56%, rgba(78,185,255,.12) 74%, transparent 90%);}
    img { display:block; width:min(62%, 280px); height:auto; max-height:132px; object-fit:contain; object-position:left; }
    .eyebrow { color:#7cdbff; letter-spacing:.18em; font-size:12px; font-weight:700; margin:40px 0 18px; text-transform:uppercase; }
    h1 { margin:0 0 18px; max-width:690px; font-size:clamp(36px, 6vw, 64px); line-height:1.06; letter-spacing:-.04em; }
    p { max-width:570px; color:#bed5e6; font-size:clamp(15px, 2.2vw, 18px); line-height:1.7; }
    .status {display:inline-flex; align-items:center; gap:10px; margin-top:24px; padding:12px 16px;
      background:rgba(75,170,244,.1); border:1px solid rgba(124,219,255,.24); border-radius:999px;
      font-size:13px; color:#dbf5ff;}
    .dot {width:8px; height:8px; background:#57d6ff; border-radius:50%; box-shadow:0 0 14px #57d6ff;}
    footer { margin-top:65px; color:#94b2c7; font-size:12px; letter-spacing:.04em; }
    @media(prefers-reduced-motion:no-preference) {.dot{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.4;box-shadow:0 0 3px #57d6ff}}}
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <img src="./NEXA_Transparent_Logo.png" alt="Logo NEXA">
    <p class="eyebrow">Intelligent Business Automation</p>
    <h1 id="title">Website NEXA sedang disiapkan.</h1>
    <p>Halaman sementara untuk menguji publikasi website melalui GitHub Pages. Desain dan konten final akan menggantikan halaman ini.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span> Deployment preview · Bukan website final</div>
    <footer>© NEXA · Website Deployment Preview</footer>
  </main>
</body>
</html>
